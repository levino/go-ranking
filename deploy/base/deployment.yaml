apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-liga
  namespace: go-liga
  labels:
    app.kubernetes.io/name: go-liga
spec:
  # SQLite is single-writer; do not scale beyond 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: go-liga
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-liga
    spec:
      serviceAccountName: go-liga
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: go-liga
          image: ghcr.io/levino/go-ranking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GO_LIGA_DB
              value: /data/go-liga.db
            - name: GO_LIGA_LISTEN
              value: ":8080"
            - name: GO_LIGA_OIDC_REDIRECT_URL
              value: "https://ranking.go-ag.levinkeller.de/auth/callback"
            - name: GO_LIGA_OIDC_ISSUER
              value: "https://id.levinkeller.de"
          envFrom:
            - secretRef:
                name: go-liga-secret
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: go-liga-data

# Placeholder. Replace by running scripts/seal-secret.sh on a host that
# has access to the k3s cluster (kubeseal needs the cluster's sealing
# certificate). The resulting SealedSecret unseals to a plain Secret
# named `go-liga-secret` in the `go-liga` namespace, with the keys:
#
#   GO_LIGA_SIGNING_KEY    64 hex chars (HMAC session signing)
#   GO_LIGA_OIDC_CLIENT_ID  from `tofu output -raw goliga_oidc_client_id`
#   GO_LIGA_OIDC_CLIENT_SECRET  from Zitadel UI (one-time reveal on app create)
#   GO_LIGA_MCP_TOKEN      random bearer token for /mcp (phase 1)
#   GO_LIGA_MCP_USER       OIDC subject of the user the MCP token acts as
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: go-liga-secret
  namespace: go-liga
spec:
  encryptedData: {}
  template:
    metadata:
      name: go-liga-secret
      namespace: go-liga
    type: Opaque

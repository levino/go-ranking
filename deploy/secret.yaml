# Apply with `kubectl apply -f deploy/secret.yaml` AFTER replacing the
# placeholder values. The signing key must be at least 32 random bytes
# encoded as hex (64 hex characters). Generate with:
#
#   head -c 32 /dev/urandom | xxd -p -c 64
#
# Recommended: keep this file out of git and use sealed-secrets or
# external-secrets for production.
apiVersion: v1
kind: Secret
metadata:
  name: go-liga-secret
  namespace: go-liga
type: Opaque
stringData:
  GO_LIGA_SIGNING_KEY: "REPLACE_WITH_64_HEX_CHARS"
  GO_LIGA_MCP_TOKEN: "REPLACE_WITH_RANDOM_TOKEN"
  GO_LIGA_BOOTSTRAP_USER: "admin"
  GO_LIGA_BOOTSTRAP_PASSWORD: "REPLACE_ON_FIRST_RUN"

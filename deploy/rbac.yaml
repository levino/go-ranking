# Service account used by the running pod. This account does NOT need
# any cluster privileges; it exists so we have a stable identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-liga
  namespace: go-liga
---
# Service account used by the GitHub Actions deployer (via OIDC).
# Carries only the minimum rights needed to roll the deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-liga-deployer
  namespace: go-liga
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-liga-deployer
  namespace: go-liga
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "deployments/scale"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-liga-deployer
  namespace: go-liga
subjects:
  - kind: ServiceAccount
    name: go-liga-deployer
    namespace: go-liga
  # GitHub Actions OIDC subjects. Cluster API server runs with
  # oidc-issuer-url=https://token.actions.githubusercontent.com,
  # oidc-username-claim=sub, audience=levinkeller-de.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: "https://token.actions.githubusercontent.com#repo:levino/go-ranking:ref:refs/heads/main"
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: "https://token.actions.githubusercontent.com#repo:levino/go-ranking:pull_request"
roleRef:
  kind: Role
  name: go-liga-deployer
  apiGroup: rbac.authorization.k8s.io

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: go-liga
resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  # secret.yaml intentionally excluded: managed out-of-band as a
  # SealedSecret. Generate locally with:
  #   kubectl create secret generic go-liga-secret -n go-liga \
  #     --from-literal=GO_LIGA_SIGNING_KEY=... \
  #     --from-literal=GO_LIGA_MCP_TOKEN=... \
  #     --from-literal=GO_LIGA_BOOTSTRAP_USER=... \
  #     --from-literal=GO_LIGA_BOOTSTRAP_PASSWORD=... \
  #     --dry-run=client -o yaml \
  #   | kubeseal --controller-namespace=kube-system \
  #              --controller-name=sealed-secrets-controller \
  #              --format=yaml > deploy/sealed-secret.yaml
  # then add `- sealed-secret.yaml` here.
  - deployment.yaml
  - service.yaml
  - ingress.yaml

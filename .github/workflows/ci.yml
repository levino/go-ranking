name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Go-Version aus go.mod statt fest verdrahtet: Hebt ein Update die
          # `go`-Direktive an (modernc.org/sqlite 1.60 verlangt Go >= 1.26, #43),
          # zieht die CI im selben PR mit.
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -race -count=1 -timeout=2m
      - name: Coverage report
        run: |
          go test ./... -coverpkg=./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1

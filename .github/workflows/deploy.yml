name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the bumped image tag back to main
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps: bump the image tag in the production overlay so Flux picks
      # up the new build on its next reconcile (no CI→cluster connection).
      - name: Update image tag in overlay
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd deploy/overlays/production
          # Find-and-replace the newTag line under the matching image.
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("kustomization.yaml")
          text = p.read_text()
          tag = os.environ["IMAGE_TAG"]
          new = re.sub(
              r"(- name: ghcr\.io/levino/go-ranking\s+newTag: )\S+",
              rf"\g<1>{tag}",
              text,
          )
          if new == text:
              raise SystemExit("kustomization.yaml unchanged — pattern mismatch")
          p.write_text(new)
          PY
          git --no-pager diff kustomization.yaml

      - name: Commit and push image bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet deploy/overlays/production/kustomization.yaml; then
            echo "no change to commit"
            exit 0
          fi
          git add deploy/overlays/production/kustomization.yaml
          git commit -m "chore(deploy): bump image to ${GITHUB_SHA::12}

          [skip ci]"
          git push origin HEAD:main

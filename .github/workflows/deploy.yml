name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for OIDC trust with the K3s cluster

    steps:
      - uses: actions/checkout@v4

      # ----- Build & push image to GHCR -----
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Roll out to K3s using GitHub OIDC -----
      # k3s API server runs with oidc-issuer-url pointing at GitHub
      # and oidc-client-id=levinkeller-de. The matching audience is
      # set on the requested OIDC token below. The User subject this
      # produces is bound to the go-liga-deployer Role in deploy/rbac.yaml.
      - name: Acquire GitHub OIDC token
        env:
          KUBE_AUDIENCE: levinkeller-de
        run: |
          curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$KUBE_AUDIENCE" \
            | jq -r .value > /tmp/oidc-token

      - name: Configure kubectl
        env:
          KUBE_SERVER: https://server.levinkeller.de:6443
          KUBE_CA: 
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: k3s
              cluster:
                server: $KUBE_SERVER
                certificate-authority-data: $KUBE_CA
          users:
            - name: oidc
              user:
                tokenFile: /tmp/oidc-token
          contexts:
            - name: deploy
              context:
                cluster: k3s
                user: oidc
                namespace: go-liga
          current-context: deploy
          EOF

      - name: Trigger rollout
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          kubectl set image deployment/go-liga go-liga="$IMAGE"
          kubectl rollout status deployment/go-liga --timeout=2m

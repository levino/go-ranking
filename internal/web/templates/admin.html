{{define "content"}}
<h1>Admin-Bereich</h1>

<h2>Gruppe anlegen</h2>
<form method="post" action="/admin/groups">
  <label>Name</label>
  <input name="name" required>
  <p><button class="btn" type="submit">Gruppe anlegen</button></p>
</form>

<h2>Benutzer anlegen</h2>
<form method="post" action="/admin/users">
  <div class="row">
    <div>
      <label>Username</label>
      <input name="username" required>
    </div>
    <div>
      <label>Passwort</label>
      <input name="password" type="password" required>
    </div>
    <div>
      <label>Gruppe</label>
      <select name="group_id">
        <option value="">— Admin (alle Gruppen)</option>
        {{range .Groups}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
      </select>
    </div>
  </div>
  <p><button class="btn" type="submit">Benutzer anlegen</button></p>
</form>

<h2>Gruppen</h2>
<ul>
{{range .Groups}}<li><a href="/g/{{.Slug}}">{{.Name}}</a> <span class="muted">({{.Slug}})</span></li>{{end}}
</ul>
{{end}}
{{template "layout" .}}
